# Production stack. Images come from the registry; only the database config and TLS files live on the host.
services:
  web:
    image: ${ERP_WEB_IMAGE:-ghcr.io/widiartowahyu3/erp-laravel-web}:${ERP_IMAGE_TAG:?ERP_IMAGE_TAG wajib diisi}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /var/cache/nginx:rw,size=64m,uid=101,gid=101,mode=700
      - /var/run:rw,size=16m,uid=101,gid=101,mode=700
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-./certbot-www}:/var/www/certbot:ro
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    networks:
      - edge
      - app
    depends_on:
      php:
        condition: service_healthy
    pids_limit: 100
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk -H 'Host: ${APP_DOMAIN:?APP_DOMAIN wajib diisi}' https://127.0.0.1:8443/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  php:
    image: ${ERP_PHP_IMAGE:-ghcr.io/widiartowahyu3/erp-laravel-php}:${ERP_IMAGE_TAG:?ERP_IMAGE_TAG wajib diisi}
    user: "1000:1000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m,mode=1777
      - /var/run:rw,size=16m,uid=1000,gid=1000,mode=700
      - /var/www/html/bootstrap/cache:rw,size=16m,uid=1000,gid=1000,mode=700
      - /var/www/html/storage/app:rw,size=16m,uid=1000,gid=1000,mode=700
      - /var/www/html/storage/framework/cache:rw,size=16m,uid=1000,gid=1000,mode=700
      - /var/www/html/storage/framework/sessions:rw,size=16m,uid=1000,gid=1000,mode=700
      - /var/www/html/storage/framework/views:rw,size=64m,uid=1000,gid=1000,mode=700
      - /var/www/html/storage/logs:rw,size=16m,uid=1000,gid=1000,mode=700
    env_file:
      - ${APP_ENV_FILE:-./.env.app}
    environment:
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN wajib diisi}
    networks:
      - app
      - backend
    depends_on:
      db:
        condition: service_healthy
    pids_limit: 150
    mem_limit: 512m
    logging: *logging
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: mariadb:12.3.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /run/mysqld:rw,size=16m,uid=999,gid=999,mode=755
      - /tmp:rw,size=256m,mode=1777
      - /var/log/mysql:rw,size=64m,uid=999,gid=999,mode=755
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/conf.d/hardening.cnf:/etc/mysql/conf.d/hardening.cnf:ro
      - ./docker/mariadb/init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_ROOT_HOST: localhost
      DB_APP_USERNAME: ${DB_APP_USERNAME:?DB_APP_USERNAME wajib diisi}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD wajib diisi}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME:?DB_MIGRATOR_USERNAME wajib diisi}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD wajib diisi}
    secrets:
      - db_root_password
    networks:
      - backend
    pids_limit: 150
    mem_limit: 1024m
    logging: *logging
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  edge:
    driver: bridge
  # PHP and the database have no route to the internet
  app:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true

volumes:
  mariadb_data:

secrets:
  db_root_password:
    file: ${DB_ROOT_PASSWORD_FILE:-./secrets/db_root_password.txt}
