# Rate limit zone definition
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

# Method-based key for login rate limiting: only POST requests are rate-limited
map $request_method $login_limit_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $login_limit_key zone=login_limit:10m rate=10r/m;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Timeouts & size limits
    client_max_body_size 32M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # Return 429 Too Many Requests when rate limit is exceeded
    limit_req_status 429;

    # Apply basic rate limiting
    limit_req zone=general_limit burst=40 nodelay;

    # Dedicated rate limiting for login endpoint (POST only, burst=5 nodelay)
    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Front controller routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only allow fastcgi execution for the front controller /index.php
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Explicitly return 404 for ANY other .php script
    location ~ \.php$ {
        return 404;
    }

    # Block access to hidden files/directories except /.well-known/
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Block access to sensitive directories anchored to path segments
    location ~* ^/(?:\.env|\.git|vendor|node_modules|storage|uploads)(?:/|$) {
        return 404;
    }

    # Block access to sensitive configuration files anchored to file names
    location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|artisan)$ {
        return 404;
    }

    # Block access to database dumps, backups, and log files
    location ~* \.(?:sql|bak|log)$ {
        deny all;
        return 404;
    }

    # Disable access logs for common browser requests
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
