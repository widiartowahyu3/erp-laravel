# Rate limit zone definition
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Timeouts & size limits
    client_max_body_size 32M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # Apply basic rate limiting
    limit_req zone=general_limit burst=40 nodelay;

    # Front controller routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only allow fastcgi execution for the front controller /index.php
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Explicitly return 404 for ANY other .php script
    location ~ \.php$ {
        return 404;
    }

    # Block access to hidden files/directories except /.well-known/
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Block access to sensitive files and directories
    location ~* /(?:\.env|\.git|composer\.(?:json|lock)|package(?:-lock)?\.json|vendor|node_modules|storage|uploads) {
        deny all;
        return 404;
    }

    # Block access to database dumps, backups, and log files
    location ~* \.(?:sql|bak|log)$ {
        deny all;
        return 404;
    }

    # Disable access logs for common browser requests
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
