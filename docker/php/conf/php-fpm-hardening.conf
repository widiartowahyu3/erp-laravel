[www]
; Process Manager (PM) Resource Allocation & Memory Hardening
; -----------------------------------------------------------------------------
; Rumus Perhitungan Alokasi Memori:
; - Base PHP Framework footprint (Laravel): ~30MB per worker
; - Argon2id memory cost (memory_cost = 65536 KiB = 64MB): ~64MB saat hashing
; - Estimasi puncak per worker: ~30MB + ~64MB = ~94MB (dibulatkan ~95MB - 100MB)
; - Total memori puncak untuk 4 worker: 4 * 95MB = ~380MB
; - Batas memori container (compose.yaml mem_limit): 512MB
; - Headroom tersisa untuk OS/kernel/tmpfs: 512MB - 380MB = ~132MB (aman dari OOM-killer)
; -----------------------------------------------------------------------------
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 30s

; Hardened functions for FPM web requests
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,symlink,link,mail,show_source,posix_kill,posix_mkfifo,posix_setuid,posix_setgid
php_admin_flag[allow_url_fopen] = off
php_admin_value[open_basedir] = /var/www/html:/tmp
