services:
  web:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    container_name: erp-trading-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /var/cache/nginx:rw,size=64m,uid=101,gid=101,mode=700
      - /var/run:rw,size=16m,uid=101,gid=101,mode=700
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - frontend
    depends_on:
      php:
        condition: service_healthy
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  php:
    build: &php-build
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: erp-trading-php:dev
    container_name: erp-trading-php
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m,mode=1777
      - /var/run:rw,size=16m,uid=${UID:-1000},gid=${GID:-1000},mode=700
    volumes:
      - ./src:/var/www/html
      - composer_cache:/tmp/composer
    environment:
      - COMPOSER_HOME=/tmp/composer
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    pids_limit: 150
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Runs scheduled artisan commands. Only needs the database, so it stays off the frontend network.
  scheduler:
    build: *php-build
    image: erp-trading-php:dev
    container_name: erp-trading-scheduler
    user: "${UID:-1000}:${GID:-1000}"
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    volumes:
      - ./src:/var/www/html
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    pids_limit: 50
    mem_limit: 256m

  db:
    image: mariadb:12.3.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    container_name: erp-trading-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /run/mysqld:rw,size=16m,uid=999,gid=999,mode=755
      - /tmp:rw,size=256m,mode=1777
      - /var/log/mysql:rw,size=64m,uid=999,gid=999,mode=755
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/conf.d/hardening.cnf:/etc/mysql/conf.d/hardening.cnf:ro
      - ./docker/mariadb/init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_ROOT_HOST: localhost
      DB_APP_USERNAME: ${DB_APP_USERNAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
    secrets:
      - db_root_password
    networks:
      - backend
    pids_limit: 150
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: erp-trading-node:24-dev
    container_name: erp-trading-node
    user: "${UID:-1000}:${GID:-1000}"
    profiles:
      - tools
      - dev
    working_dir: /var/www/html
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=128m,mode=1777
    volumes:
      - ./src:/var/www/html
      - npm_cache:/home/node/.npm
    environment:
      HOME: /home/node
      npm_config_cache: /home/node/.npm
      VITE_PORT: ${VITE_PORT:-5174}
    ports:
      - "127.0.0.1:${VITE_PORT:-5174}:5173"
    networks:
      - frontend
    pids_limit: 200
    mem_limit: 512m

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mariadb_data:
  composer_cache:
  npm_cache:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
