services:
  web:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: erp-trading-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw
      - /var/cache/nginx:rw
      - /var/run:rw
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - frontend
    depends_on:
      php:
        condition: service_healthy
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: erp-trading-php:dev
    container_name: erp-trading-php
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777
      - /var/run:rw
    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer
    environment:
      - COMPOSER_HOME=/tmp/composer
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    pids_limit: 150
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  db:
    image: mariadb:12.3.3
    container_name: erp-trading-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /run/mysqld:rw,uid=999,gid=999,mode=777
      - /tmp:rw,mode=1777
      - /var/log/mysql:rw,uid=999,gid=999,mode=777
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/conf.d/hardening.cnf:/etc/mysql/conf.d/hardening.cnf:ro
      - ./docker/mariadb/init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_APP_USERNAME: ${DB_APP_USERNAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
    networks:
      - backend
    pids_limit: 150
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node:
    image: node:22-alpine
    container_name: erp-trading-node
    user: "1000:1000"
    profiles:
      - tools
      - dev
    working_dir: /var/www/html
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777
    volumes:
      - .:/var/www/html
      - npm_cache:/home/node/.npm
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    networks:
      - frontend
    pids_limit: 200
    mem_limit: 512m

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mariadb_data:
  composer_cache:
  npm_cache:
