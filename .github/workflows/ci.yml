name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: every pushed commit must keep its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    name: Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the whole history, not only the tip of the push
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment and ephemeral secrets
        run: |
          set +x
          mkdir -p secrets
          chmod 700 secrets

          DB_ROOT_PW=$(openssl rand -hex 24)
          APP_KEY="base64:$(openssl rand -base64 32)"
          MIGRATOR_PW=$(openssl rand -hex 24)
          APP_PW=$(openssl rand -hex 24)

          echo -n "$DB_ROOT_PW" > secrets/db_root_password.txt
          chmod 644 secrets/db_root_password.txt

          cp .env.example .env
          sed -i "s|^UID=.*|UID=$(id -u)|" .env
          sed -i "s|^GID=.*|GID=$(id -g)|" .env
          sed -i "s|^DB_APP_PASSWORD=.*|DB_APP_PASSWORD=${APP_PW}|" .env
          sed -i "s|^DB_MIGRATOR_PASSWORD=.*|DB_MIGRATOR_PASSWORD=${MIGRATOR_PW}|" .env
          chmod 600 .env

          cp src/.env.example src/.env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" src/.env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${APP_PW}|" src/.env
          sed -i "s|^APP_ENV=.*|APP_ENV=local|" src/.env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=true|" src/.env
          sed -i "s|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|" src/.env
          sed -i "s|^SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=false|" src/.env
          chmod 600 src/.env

          # Verifikasi penggantian kunci tanpa membocorkan nilai rahasia
          [ $(grep -c "^UID=$(id -u)$" .env) -eq 1 ] || { echo "Failed: UID replacement mismatch" >&2; exit 1; }
          [ $(grep -c "^GID=$(id -g)$" .env) -eq 1 ] || { echo "Failed: GID replacement mismatch" >&2; exit 1; }
          [ $(grep -c "^DB_APP_PASSWORD=change_this_" .env) -eq 0 ] || { echo "Failed: DB_APP_PASSWORD placeholder remains" >&2; exit 1; }
          [ $(grep -c "^DB_MIGRATOR_PASSWORD=change_this_" .env) -eq 0 ] || { echo "Failed: DB_MIGRATOR_PASSWORD placeholder remains" >&2; exit 1; }
          [ $(grep -c "^DB_APP_PASSWORD=" .env) -eq 1 ] || { echo "Failed: DB_APP_PASSWORD missing" >&2; exit 1; }
          [ $(grep -c "^DB_MIGRATOR_PASSWORD=" .env) -eq 1 ] || { echo "Failed: DB_MIGRATOR_PASSWORD missing" >&2; exit 1; }

          [ $(grep -c "^APP_KEY=base64:" src/.env) -eq 1 ] || { echo "Failed: APP_KEY missing" >&2; exit 1; }
          [ $(grep -c "^DB_PASSWORD=change_this_" src/.env) -eq 0 ] || { echo "Failed: DB_PASSWORD placeholder remains" >&2; exit 1; }
          [ $(grep -c "^DB_PASSWORD=" src/.env) -eq 1 ] || { echo "Failed: DB_PASSWORD missing" >&2; exit 1; }
          [ $(grep -c "^APP_ENV=local$" src/.env) -eq 1 ] || { echo "Failed: APP_ENV mismatch" >&2; exit 1; }

      - name: Build Docker images
        run: docker compose build

      - name: Start database
        run: docker compose up -d --wait --wait-timeout 180 db

      - name: Install backend dependencies
        run: docker compose run --rm -T php composer install --no-interaction --prefer-dist --no-progress < /dev/null

      - name: Install frontend dependencies
        run: docker compose --profile tools run --rm -T node npm ci --no-audit --no-fund < /dev/null

      - name: Frontend build (Vite)
        run: docker compose --profile tools run --rm -T node npm run build < /dev/null

      - name: Start Docker services
        run: docker compose up -d --wait --wait-timeout 180

      - name: Diagnostic container logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose ps ==="
          docker compose ps -a
          echo "=== Database logs ==="
          docker compose logs --no-color --tail=150 db
          echo "=== Web & PHP logs ==="
          docker compose logs --no-color --tail=80 web php

      - name: Reset & migrate test database
        run: make test-db-reset

      - name: Backend code style (Pint)
        run: make lint

      - name: Static analysis (PHPStan / Larastan)
        run: make analyse

      - name: Backend tests (Pest)
        run: make test

      - name: Frontend unit & component tests (Vitest)
        run: make test-js

      - name: Frontend code style (ESLint)
        run: make lint-js

      - name: Composer manifest validation
        run: docker compose run --rm -T php composer validate --no-check-publish --strict < /dev/null

      - name: Composer security audit
        run: docker compose run --rm -T php composer audit < /dev/null

      - name: NPM security audit (all dependencies)
        run: docker compose --profile tools run --rm -T node npm audit --audit-level=high < /dev/null

      - name: NPM security audit (runtime dependencies)
        run: docker compose --profile tools run --rm -T node npm audit --omit=dev --audit-level=moderate < /dev/null

      - name: Hardening verification
        run: make verify

      - name: Secret scanning (Gitleaks)
        run: |
          docker run --rm --network none -v "${PWD}:/repo:ro" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --no-banner

  production-image:
    name: Production Image Smoke Test
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production images and smoke test the stack
        run: make prod-smoke
